name = "helpdesk-api"
main = "backend/src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Web UI (public/ = built from frontend/) — served by Workers Static Assets; API requests fall through to the Worker.
[assets]
directory = "./public"

# Workers AI — AI triage, code in backend/src/ai/ (P4). Free tier; no API key.
[ai]
binding = "AI"

# Workers Logs: keep console output (e.g. the "maintenance webhook" lines) so past requests can be checked
# in the Cloudflare dashboard, not only live with `wrangler tail`. Our logs never contain bodies or secrets.
[observability]
enabled = true

# PRD §14 escalation check every 15 minutes (P2)
[triggers]
crons = ["*/15 * * * *"]

# Values for LOCAL dev (`wrangler dev`): Team 10 empty = mock work orders (WO-MOCK-*), so tests run offline.
# Production values are set by `npm run deploy` (package.json): ENVIRONMENT=production + Team 10's real URLs
#   API:    https://maintenance-team10.vercel.app/api/v1
#   portal: https://maintenance-team10-kwxt.vercel.app/
# To talk to the real Team 10 locally, put MAINTENANCE_API_URL (+ the key) in .dev.vars.
[vars]
ENVIRONMENT = "development"
WELLBEING_API_URL = "https://wellbeing-intake.vercel.app/api/v1"
# Referral to Wellbeing (Team 16): "on" shows the "Send to Wellbeing" button. Keep "off" until Team 16 has built
# POST/GET /referrals and the callback, and migration 0007 has run (npm run db:remote:referrals).
WELLBEING_REFERRALS = "off"
MAINTENANCE_API_URL = ""
# Team 10 "report a repair" page for the admin button; may contain {ticketRef} (replaced by the ticket number)
MAINTENANCE_PORTAL_URL = ""
# Notification Hub endpoint for outbound events — empty = outbox only (P2)
EVENT_HUB_URL = ""

# Secrets (never commit):
#   wrangler secret put MAINTENANCE_API_KEY          (Team 10's HELPDESK_API_KEY)
#   wrangler secret put MAINTENANCE_WEBHOOK_SECRET   (Team 10's HELPDESK_WEBHOOK_SECRET)
#   wrangler secret put EVENT_SIGNING_SECRET
#   wrangler secret put WELLBEING_API_KEY            (Bearer token for Team 16's referral API, if they want one)
#   wrangler secret put WELLBEING_WEBHOOK_SECRET     (HMAC key shared with Team 16 for referral callbacks)
# Local dev: put them in .dev.vars (git-ignored)

[[d1_databases]]
binding = "DB"
database_name = "helpdesk-db"
database_id = "0979f6e1-5381-4b7e-867b-5265e4f8c6dc"

name = "helpdesk-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
WELLBEING_API_URL = "https://wellbeing-intake.vercel.app/api/v1"

# D1 binding — database_id ได้จาก `wrangler d1 create helpdesk-db`
# หมายเหตุ: Cloudflare แนะนำชื่อ binding เป็น "helpdesk_db" แต่โค้ดใช้ "DB" → คงไว้เป็น "DB" ให้ตรงกับ c.env.DB
[[d1_databases]]
binding = "DB"
database_name = "helpdesk-db"
database_id = "0979f6e1-5381-4b7e-867b-5265e4f8c6dc"

# Local dev (optional) — ใช้ตอน wrangler dev
# [[d1_databases]]
# binding = "DB"
# database_name = "helpdesk-db-local"
# database_id = "local"